apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-service
  namespace: forum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forum-service
  template:
    metadata:
      labels:
        app: forum-service
    spec:
      containers:
        - name: forum-service
          image: marammanai/forum-service:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8088  # ✅ DOIT matcher `server.port=8088`
          env:
            - name: EUREKA_URL
              value: http://discovery-service.discovery.svc.cluster.local:8761/eureka/
          volumeMounts:
            - name: cephfs-vol
              mountPath: /mnt/cephfs
      volumes:
        - name: cephfs-vol
          persistentVolumeClaim:
            claimName: cephfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: forum-service
  namespace: forum
spec:
  selector:
    app: forum-service
  ports:
    - port: 8088   # ✅ Même port que `server.port`
      targetPort: 8088
